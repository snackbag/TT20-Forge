plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

if (compareWith("1.20.6") < 0) {
    apply plugin: 'org.spongepowered.mixin'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def compareWith(String version) {
    return stonecutter.compare(stonecutter.current.version, version)
}

if (compareWith("1.20.5") >= 0) {
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
} else {
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    if (compareWith("1.20.6") >= 0) {
        reobf = false
    }

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            /*if (compareWith("1.21.9") >= 0) {
                property 'eventbus.api.strictRuntimeChecks', 'true'

                arg "-mixin.config=mixin.${mod_id}.json"
            } else {
                mods {
                    "${mod_id}" {
                        source sourceSets.main
                    }
                }
            }*/
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (compareWith("1.21.9") < 0) {
    mixin {
        add sourceSets.main, "refmap.tt20.json"
        config "mixin.tt20.json"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven { // fix MacOS
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    if (compareWith("1.21.9") >= 0) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    } else {
        maven {
            url = 'https://repo.spongepowered.org/maven'
        }
    }
    maven {  // ShitLib
        name = 'SnackBag'
        url = "https://artifacts.snackbag.net/artifactory/shitlib"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    /*if (compareWith("1.21.9") < 0) {
        implementation 'org.spongepowered:mixin:0.8.7'
        annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    }*/

    if (compareWith('1.21.6') >= 0) {
        annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'
    }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3")) {
        jarJar.ranged(it, "[0.5.3,)")
    }

    implementation "net.snackbag.shit:shit:${project.shitlib_version}"
    //include "net.snackbag.shit:shit:${project.shitlib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: forge_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
        if (compareWith('1.20.6') < 0) {
            finalizedBy 'reobfJar'
        } else {
            attributes['MixinConfigs'] = "mixin.${mod_id}.json"
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }

eclipse {
    synchronizationTasks 'genEclipseRuns'
}

if (compareWith('1.20.6') >= 0) {
    sourceSets.each {
        def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
        it.output.resourcesDir = dir
        it.java.destinationDirectory = dir
    }
}